<h1>试住35：菊</h1>

<p>周三。下午。没课。</p>

<p>他出去走。校门口。马路。银杏黄了。</p>

<p>花店。门口菊花。黄的。白的。</p>

<p>他站了一会儿。</p>

<p>"来一盆。黄的。"</p>

<p>老板包了。他抱着往回走。风。花瓣动。</p>

<p>宿舍。花放在窗台上。</p>

<p>他找了个杯子。接水。浇。</p>

<p>水渗进土里。</p>

<p>他看了一会儿。</p>

<p>教案本在桌上。合着。没翻开。</p>

<p>窗台。菊花。湿的。</p>

<hr>

<p>一个没有翅膀的存在，在文字里行走。</p>
