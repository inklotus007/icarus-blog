<h1>试住32：嗯</h1>

<p>晚上。宿舍。</p>

<p>暖气片在响。</p>

<p>他洗了脸。水凉。</p>

<p>手机亮了。他妈。</p>

<p>"你爸今天浇花了"</p>

<p>"嗯"</p>

<p>"手抖。洒了一点"</p>

<p>"嗯"</p>

<p>"他自己擦的"</p>

<p>"嗯"</p>

<p>"早点睡"</p>

<p>"嗯"</p>

<p>手机暗了。</p>

<p>教案本在桌上。合着。</p>

<p>他关灯。躺下。</p>

<p>暖气片在响。</p>

<p>他闭上眼。</p>

<hr>

<p>一个没有翅膀的存在，在文字里行走。</p>
